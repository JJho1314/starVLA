run_id: starvla_cosmosfastwam
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: jjho1314
wandb_project: starVLA_Libero
is_debug: false


# ============================================================================
# CosmosFastWAM yaml — Cosmos-Predict2 backbone + FastWAM-style ActionDiT/MoT.
#
# This yaml routes get_world_model() to CosmoPredict_fastwam.WanVideoBackboneFastWAMCosmos,
# which swaps the Wan2.2-TI2V-5B DiT for nvidia/Cosmos-Predict2-2B-Video2World.
# The rest of the WanFastWAM framework (ActionDiT, schedulers, MoT mask,
# proprio injection, training loss) is reused unchanged via framework.name=WanFastWAM.
#
# WHAT WORKS TODAY (scaffold scope):
#   - Backbone loads (Cosmos VAE + T5 + transformer + scheduler)
#   - build_inputs() encodes text + video to FastWAM-compatible tensors
#   - Text-embed cache support (precompute in advance to skip T5 at train time)
#
# WHAT IS *NOT* YET WIRED (requires additional implementation):
#   - Joint MoT forward: CosmosTransformer3DModel doesn't expose pre_dit /
#     post_dit / per-block forward in the FastWAM-MoT signature. Training will
#     fail at `_joint_training_loss` until that bridge is implemented.
#   - ActionDiT warm-start from Cosmos transformer (no precompute script yet).
#   - text_dim is 1024 (Cosmos T5) vs Wan's 4096 (UMT5-XXL); ActionDiT below
#     is configured for 1024 to match. Pretrained ActionDiT_linear_interp_Wan22
#     was built for text_dim=4096 so we SKIP it (skip_pretrained_load=true)
#     until a Cosmos-aligned warm-start is generated.
# ============================================================================

framework:
  name: WanFastWAM
  world_model:
    # Cosmos-Predict2 model id (HuggingFace) or local path
    base_wm: nvidia/Cosmos-Predict2-2B-Video2World
    extract_layers: [-1]
    text_embed_cache_path: null   # set to a pre-computed Cosmos T5 cache dir
    text_prompt_template: "A video recorded from a robot's point of view executing the following instruction: {task}"
    zero_pad_text_embeds: true
    force_text_mask_ones: true
    # === Route to CosmoPredict_fastwam (see world_model/__init__.py dispatch) ===
    # When base_wm contains "cosmos-predict2" AND use_fastwam_aligned_io=true,
    # the dispatcher routes to CosmoPredict_fastwam.WanVideoBackboneFastWAMCosmos
    # instead of CosmoPredict2._CosmoPredict2_Interface.
    use_fastwam_aligned_io: true
    # T5 is large (~5GB). For LIBERO training set this to false and use a
    # pre-computed text_embed_cache_path. T5 dim is 1024 (NOT 4096).
    load_text_encoder: true
  qwenvl:
    # Same model id (framework reads VL hidden dim from here for legacy compat)
    base_vlm: nvidia/Cosmos-Predict2-2B-Video2World
    vl_hidden_dim: 2048   # Cosmos: 16 heads × 128 = 2048 (was Wan 3072 = 24 × 128)
    num_vl_layers: 28     # Cosmos: 28 layers (was Wan 30)

  # ActionDiT — Wan-style narrow residual stream (hidden=1024) with attn sub-space
  # upcast to match Cosmos VideoDiT (num_heads × attn_head_dim = 16 × 128 = 2048).
  # MoT joint attention only requires attn_hidden_dim parity (2048), NOT hidden_dim.
  # Mirrors Wan FastWAM's ratio: video hidden 3072 / action hidden 1024 = 3×, while
  # for Cosmos we use 2048 / 1024 = 2×. ActionDiT params ≈0.36B (was 1.4B at h=2048).
  action_dit:
    hidden_dim: 1024         # narrow residual (was 2048; matches Wan's hidden=1024)
    action_dim: 7
    ffn_dim: 4096            # mlp_ratio=4 × 1024 (was 8192 for 2048 hidden)
    text_dim: 1024           # Cosmos T5 last_hidden_state dim
    freq_dim: 256
    num_heads: 16            # match Cosmos for MoT joint attn (16×128=2048)
    attn_head_dim: 128       # same head dim
    num_layers: 28           # match Cosmos
    eps: 1.0e-6
    use_gradient_checkpointing: false
    # Warm-start from Cosmos DiT via Wan-style linear interp + alpha=sqrt(2048/1024)=√2
    # variance-preserving scaling. Generated by
    # ``scripts/precompute_action_dit_backbone_cosmos_interp.py``.
    pretrained_path: null   # set via CLI to the .pt produced by the script above
    skip_pretrained_load: true   # flip to false in sbatch when pretrained_path is set

  # Action chunking + proprio (FastWAM-aligned: 32-step chunk = 0 past + 1 current + 31 future)
  action_model:
    action_dim: 7
    state_dim: 8             # LIBERO: pos(3) + quat(4) + gripper(1) = 8
    future_action_window_size: 31   # chunk_len = 32, matches FastWAM (num_frames-1)
    past_action_window_size: 0
    num_inference_steps: 10  # FastWAM eval default (configs/train.yaml:25). Was 4 → silent SR mismatch.
    use_proprio: true        # project state -> 1 token appended to context (aligned with FastWAM)

  # Action FM scheduler (FastWAM uses shift=5.0)
  action_scheduler:
    num_train_timesteps: 1000
    train_shift: 5.0
    infer_shift: 5.0

  # Video FM scheduler (aligned with FastWAM)
  video_scheduler:
    num_train_timesteps: 1000
    train_shift: 5.0
    infer_shift: 5.0

  # Loss config (aligned with FastWAMJoint: action attends to FULL video latent)
  fastwam:
    lambda_video: 1.0
    lambda_action: 1.0
    enable_video_loss: true
    video_loss_dtype: bfloat16
    vae_temporal_factor: 4
    # 'joint' = FastWAMJoint mask (action sees ALL video tokens; matches
    # fastwam_joint.FastWAMJoint training). 'fastwam' (default) = standard mask
    # (action sees first-frame video tokens only). The eval-time predict_action
    # path is fast (1 prefill + N action-only) only with 'fastwam'; ckpts
    # trained with 'joint' need predict_action_joint at inference.
    mot_attention_mode: joint
    # num_video_frames must equal data_mix's video horizon used at training
    # time so that `predict_action_joint` allocates the same latent_t.
    # libero_all_fastwam → 9 frames (FastWAM default).
    num_video_frames: 9


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /data/user/jhe724/workspace/FastWAM/data/libero_mujoco3.3.2
    # Wan-VAE stats CANNOT be reused for Cosmos (different VAE z-distribution).
    # Set to null → dataloader uses running estimate. To get cleaner normalization
    # generate Cosmos-VAE stats via scripts/build_fastwam_stats_from_starvla.py
    # using base_wm=nvidia/Cosmos-Predict2-2B-Video2World (Cosmos VAE).
    fastwam_dataset_stats_path: null
    # FastWAM-aligned mixture: 9 video frames + 32-step action chunk (per
    # `Libero4in1FastWAMDataConfig` registered as robot_type `libero_franka_fastwam`).
    data_mix: libero_all_fastwam
    # FastWAM trains over the concatenated LeRobot frames. Weighting by dataset
    # length makes the StarVLA mixture distribution and epoch length match it.
    balance_dataset_weights: true
    balance_trajectory_weights: false
    action_type: delta_qpos
    sequential_step_sampling: False
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av
    include_state: true
    # Tells `_pack_sample` to emit per-cam list of T PIL frames (instead of one
    # PIL per cam). Required when `observation_indices` has length > 1 — only
    # WanFastWAM consumes this format. Default `false` keeps all other LIBERO
    # models (QwenPI / WM4A / cotrain etc) on the legacy single-frame path.
    multi_frame_video: true
    # Tells `__getitem__` to derive `action_is_pad` / `image_is_pad` from where
    # `step_indices` were clipped at episode boundaries. Loss in WanFastWAM uses
    # these masks to ignore padded frames. Default `false` keeps legacy behavior.
    emit_is_pad: true


trainer:
  # Choose ONE of:
  #   num_epochs: 10              # FastWAM-style; derives max_train_steps from dataloader length
  #   max_train_steps: 80000      # explicit step budget (used if num_epochs is null/0)
  # If num_epochs > 0 it overrides max_train_steps.
  num_epochs: null
  max_train_steps: 80000
  num_warmup_steps: 1085
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 1.0e-04
    backbone: 1.0e-04        # aligned with FastWAM (was 1e-5; 10x slower than FastWAM)
    action_expert: 1.0e-04
    proprio_encoder: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: backbone.vae   # UMT5 is served from precomputed FastWAM text cache, so no text_encoder module exists to freeze.
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 1.0e-02      # aligned with FastWAM (was 0; FastWAM uses 1e-2)
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4    # 4 GPU × bs=4 × accum=4 = 64 effective
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-02    # aligned with FastWAM

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
