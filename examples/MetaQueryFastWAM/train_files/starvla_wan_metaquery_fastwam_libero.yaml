run_id: starvla_wan_metaquery_fastwam
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: jjho1314
wandb_project: starVLA_Libero
is_debug: false


framework:
  name: WanMetaQueryFastWAM

  # ─── Inherits everything from WanFastWAM ──────────────────────────────
  world_model:
    base_wm: /data/user/jhe724/workspace/weights/Wan2.2-TI2V-5B-Diffusers
    extract_layers: [-1]
    text_embed_cache_path: /data/user/jhe724/workspace/FastWAM/data/text_embeds_cache/libero
    text_prompt_template: "A video recorded from a robot's point of view executing the following instruction: {task}"
    zero_pad_text_embeds: true
    force_text_mask_ones: true

  qwenvl:
    base_vlm: /data/user/jhe724/workspace/weights/Wan2.2-TI2V-5B-Diffusers
    vl_hidden_dim: 3072
    num_vl_layers: 30

  action_dit:
    hidden_dim: 1024
    action_dim: 7
    ffn_dim: 4096
    text_dim: 4096
    freq_dim: 256
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-6
    use_gradient_checkpointing: false
    pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
    skip_pretrained_load: false

  action_model:
    action_dim: 7
    state_dim: 8
    future_action_window_size: 31
    past_action_window_size: 0
    num_inference_steps: 10
    use_proprio: true

  action_scheduler: {num_train_timesteps: 1000, train_shift: 5.0, infer_shift: 5.0}
  video_scheduler:  {num_train_timesteps: 1000, train_shift: 5.0, infer_shift: 5.0}

  fastwam:
    lambda_video: 1.0
    lambda_action: 1.0
    enable_video_loss: true
    video_loss_dtype: bfloat16
    vae_temporal_factor: 4

  # ─── NEW: VLM-side conditioning (Plan B — append to T5 ctx) ─────────────
  vlm:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa            # set to flash_attention_2 if available
    num_queries: 64                      # tokens between <|begin_of_img|> and <|end_of_img|>
    trainable: false                     # MetaQuery-style: freeze MLLM
    # ─── Per-layer shape aligned with MetaQuery (models/model.py:203-214) ───
    # heads = vlm_hidden // 64, kv_heads = heads (no GQA), ffn = 4×, RoPE.
    # Depth is REDUCED from MetaQuery's 24 → 8 because Wan video DiT is
    # fully trainable in our setup (MetaQuery freezes diffusion).
    # → expected connector size ~840M (vs ~2.54B at depth=24).
    # If you want strict MetaQuery-XL alignment, set connector_num_layers: 24.
    connector_num_layers: 8              # MetaQuery uses 24; 8 = Q-Former / Resampler scale
    connector_num_heads: 40              # 2560 / 64 = 40 (for Qwen3-VL-4B)
    connector_num_kv_heads: 40           # no GQA, matches MetaQuery
    connector_ffn_mult: 4                # intermediate = hidden * 4
    connector_rope_theta: 1000000.0      # Qwen3 default RoPE base (MetaQuery used Qwen2's 1e4)
    rms_init: 1.0                        # MetaQuery+Sana uses ~2.345 (sqrt(5.5)); Wan uses 1.0


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /data/user/jhe724/workspace/FastWAM/data/libero_mujoco3.3.2
    fastwam_dataset_stats_path: /data/user/jhe724/workspace/FastWAM/runs/libero_uncond_2cam224_1e-4/2026-05-09_16-19-41/dataset_stats.json
    data_mix: libero_all_fastwam
    balance_dataset_weights: true
    balance_trajectory_weights: false
    action_type: delta_qpos
    sequential_step_sampling: False
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 2          # halved vs WanFastWAM: VLM adds ~8GB on H100
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av
    include_state: true
    multi_frame_video: true
    emit_is_pad: true
    # ── Validation split (held out deterministically by cfg.seed) ──
    # Set val_fraction > 0 (or val_num_samples > 0) to enable val passes.
    # Disable by setting both to 0.
    val_fraction: 0.02                # 2% held out for validation (~1k samples on libero_all_fastwam)
    val_num_samples: 0                # alternative: hard cap (overrides val_fraction if > 0)


trainer:
  num_epochs: null
  max_train_steps: 80000
  num_warmup_steps: 1085
  save_interval: 10000
  eval_interval: 100
  # ── Validation pass (no-op if datasets.vla_data.val_fraction == 0) ──
  val_interval: 500                # run held-out val pass every N optimizer steps
  val_num_batches: 8               # batches averaged per val pass (per rank)
  learning_rate:
    base: 1.0e-04
    backbone: 1.0e-04
    action_expert: 1.0e-04
    proprio_encoder: 1.0e-04
    connector: 5.0e-04             # higher LR for randomly-initialised connector
    vlm: 0.0                       # frozen
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Freeze: Wan VAE + entire VLM. Connector / video DiT / ActionDiT / proprio_encoder train.
  freeze_modules: 'backbone.vae,vlm'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 1.0e-02
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8     # bumped to compensate for halved per-device bs
  gradient_checkpointing: false

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-02

  is_resume: false
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
