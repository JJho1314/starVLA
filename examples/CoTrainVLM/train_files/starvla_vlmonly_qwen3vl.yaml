run_id: starvla_vlmonly
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: jjho1314
wandb_project: starVLA_VLM
is_debug: false


framework:
  name: QwenFast
  qwenvl:
    base_vlm: /data/user/jhe724/workspace/weights/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: FAST
    action_dim: 7
    future_action_window_size: 15
    past_action_window_size: 0


datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl     # rope2d v2.5 (Qwen3-VL inherits Qwen2.5-VL rope)
    per_device_batch_size: 2  # 4B model + 4096-seq → bs=2 per H100 80GB


trainer:
  epochs: 100
  max_train_steps: 50000      # adjust as needed
  num_warmup_steps: 2500
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vlm: 1.0                  # VLM-only: full weight on lm loss
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
